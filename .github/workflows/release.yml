name: Publish reviewed StudyApp release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Verify reviewed main and unique version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$sha" = "$current"
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "Tag already exists; refusing to overwrite" >&2
            exit 1
          fi
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f head_sha="$sha" -f status=completed -f per_page=100 > "$RUNNER_TEMP/ci-runs.json"
          node -e 'const r=require(process.argv[1]);if(!r.workflow_runs?.some(x=>x.head_sha===process.env.SOURCE_SHA&&x.conclusion==="success"&&x.event==="push"))process.exit(1)' "$RUNNER_TEMP/ci-runs.json"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: Package verified PWA build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studyapp-artifact"
          cp -R dist "$RUNNER_TEMP/studyapp-artifact/studyapp"
          printf '%s\n' "version=$RELEASE_VERSION" "source_sha=$SOURCE_SHA" > "$RUNNER_TEMP/studyapp-artifact/studyapp/RELEASE.txt"
          cd "$RUNNER_TEMP/studyapp-artifact"
          zip -qr "StudyApp-v$RELEASE_VERSION.zip" studyapp
          sha256sum "StudyApp-v$RELEASE_VERSION.zip" > "StudyApp-v$RELEASE_VERSION.zip.sha256"
      - name: Revalidate main before publishing
        run: |
          test "$SOURCE_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag "v$RELEASE_VERSION" "$SOURCE_SHA"
          git push origin "refs/tags/v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" \
            "$RUNNER_TEMP/studyapp-artifact/StudyApp-v$RELEASE_VERSION.zip" \
            "$RUNNER_TEMP/studyapp-artifact/StudyApp-v$RELEASE_VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "StudyApp v$RELEASE_VERSION" --generate-notes
