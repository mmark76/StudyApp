name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run check:version

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test StudyApp Local companion
        run: python3 -m unittest local-companion/test_openai_connection.py

      - name: End-to-end test
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Verify StudyApp Local package
        run: |
          set -eu
          node scripts/prepare-studyapp-local-package.mjs "$RUNNER_TEMP/StudyApp-Local-Windows"
          test -f "$RUNNER_TEMP/StudyApp-Local-Windows/dist/index.html"
          test -f "$RUNNER_TEMP/StudyApp-Local-Windows/local-companion/server.py"
          test -f "$RUNNER_TEMP/StudyApp-Local-Windows/Start StudyApp Local.bat"
          test -f "$RUNNER_TEMP/StudyApp-Local-Windows/Install StudyApp Local Launcher.bat"
          test -f "$RUNNER_TEMP/StudyApp-Local-Windows/Uninstall StudyApp Local Launcher.bat"
          test -f "$RUNNER_TEMP/StudyApp-Local-Windows/local-companion/studyapp-local-protocol.ps1"
          test ! -e "$RUNNER_TEMP/StudyApp-Local-Windows/local-companion/.chatgpt-plan-venv"
          test ! -e "$RUNNER_TEMP/StudyApp-Local-Windows/local-companion/Start-StudyApp-Local.bat"
